services:
  db:
    image: postgres:15
    container_name: nexora-db
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora_password
      POSTGRES_DB: nexora
    ports:
      - "5432:5432"
    volumes:
      - nexora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nexora-api
    environment:
      DATABASE_URL: postgresql://nexora:nexora_password@db:5432/nexora
      JWT_SECRET: change-this-to-a-long-random-string
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexora-web
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  nexora_pgdata:
