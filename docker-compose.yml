version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://nexora_user:secure_password_123@nexora-postgres:5432/nexora_finance_testnet}
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-long-random-string}
      - PORT=4000
      - NODE_ENV=production
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:4000}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    depends_on:
      nexora-postgres:
        condition: service_healthy
    networks:
      - nexora-network

  nexora-postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=nexora_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secure_password_123}
      - POSTGRES_DB=nexora_finance_testnet
    ports:
      - "5432:5432"
    volumes:
      - nexora-db:/var/lib/postgresql/data
      - ./server/database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - nexora-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora_user -d nexora_finance_testnet"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nexora-db:

networks:
  nexora-network:
    driver: bridge